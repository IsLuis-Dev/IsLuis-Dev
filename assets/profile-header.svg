<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Luis Cruz - Flutter and Full-Stack Developer</title>
  <desc id="desc">Minimal professional banner for software developer Luis Cruz.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.62" stop-color="#0c2038"/>
      <stop offset="1" stop-color="#123253"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <path d="M850 0 H1200 V280 H1030 Z" fill="#38bdf8" opacity="0.035"/>
  <circle cx="1040" cy="140" r="94" fill="#071827" fill-opacity="0.42" stroke="#7dd3fc" stroke-opacity="0.18"/>
  <circle cx="1110" cy="62" r="5" fill="#38bdf8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="68" y="57" width="52" height="4" rx="2" fill="url(#accent)"/>
    <text x="68" y="120" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="0.2">LUIS CRUZ</text>
    <text x="70" y="163" fill="#dbeafe" font-size="24" font-weight="500">Flutter &amp; Full-Stack Developer</text>
    <text x="70" y="205" fill="#94b9d8" font-size="16" font-weight="500" letter-spacing="1.8">MOBILE  ·  WEB  ·  UI/UX  ·  SECURE DEVELOPMENT</text>

    <text x="1040" y="158" fill="#ffffff" font-size="49" font-weight="650" text-anchor="middle" letter-spacing="-1">LC</text>
    <rect x="987" y="181" width="106" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>
