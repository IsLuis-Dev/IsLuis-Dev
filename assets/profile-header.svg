<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Luis Alberto Cruz Rojas - Full-Stack and Flutter Developer</title>
  <desc id="desc">Professional banner illustrating mobile, cloud, and application security development.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2447"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54c5f8"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8cc8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="36" r="170" fill="#3da9fc" opacity="0.08"/>
  <circle cx="1020" cy="290" r="145" fill="#54c5f8" opacity="0.06"/>
  <rect x="860" y="28" width="292" height="264" rx="26" fill="#071827" fill-opacity="0.48" stroke="#7dd3fc" stroke-opacity="0.16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="102" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="68" y="158" fill="#ffffff" font-size="36" font-weight="750" letter-spacing="0.4">LUIS ALBERTO CRUZ ROJAS</text>
    <text x="72" y="205" fill="#dbeafe" font-size="25" font-weight="600">FULL-STACK + FLUTTER DEVELOPER</text>
    <text x="72" y="249" fill="#9fc9ee" font-size="16" font-weight="500" letter-spacing="2">MOBILE  •  WEB  •  UI/UX  •  APPLIED SECURITY</text>
    <rect x="72" y="274" width="284" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <g transform="translate(900 55) scale(0.78)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 96 C58 96 47 53 76 35 C88 6 132 2 150 28 C181 17 213 42 207 74 C232 89 221 124 194 124 H95 C75 124 63 114 63 99" stroke="#79cfff" stroke-width="4" opacity="0.9"/>

    <rect x="12" y="92" width="105" height="164" rx="18" fill="#081827" stroke="#dbeafe" stroke-width="4"/>
    <line x1="47" y1="108" x2="82" y2="108" stroke="#79cfff" stroke-width="4"/>
    <circle cx="65" cy="237" r="5" fill="#79cfff" stroke="none"/>
    <path d="M48 145 L66 127 L83 145 L66 164 Z" fill="url(#accent)" stroke="none" filter="url(#glow)"/>
    <path d="M48 145 L66 164 L83 145 L73 184 L59 184 Z" fill="#54c5f8" stroke="none" opacity="0.9"/>

    <path d="M194 138 L244 157 V198 C244 228 224 252 194 264 C164 252 144 228 144 198 V157 Z" fill="#0a1f33" stroke="#79cfff" stroke-width="4"/>
    <path d="M173 200 L188 215 L218 180" stroke="#7dd3fc" stroke-width="7"/>

    <path d="M116 172 C129 154 141 147 158 142" stroke="#79cfff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 8"/>
    <path d="M205 125 C202 137 200 143 198 153" stroke="#79cfff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="116" cy="172" r="4" fill="#79cfff" stroke="none"/>
    <circle cx="158" cy="142" r="4" fill="#79cfff" stroke="none"/>
  </g>
</svg>
